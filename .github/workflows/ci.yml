name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Lint with ruff
        run: uv run ruff check --output-format=github .
      - name: Format check with ruff
        run: uv run ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run mypy
        run: uv run mypy src examples
      - name: Run pyright
        run: uv run pyright

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies for OCP / OpenGL / Vulkan Lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxrender1 libxcursor1 libxft2 libxinerama1 mesa-vulkan-drivers
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Record pre-generation timestamp
        run: python3 -c "import time; open('/tmp/examples_ts', 'w').write(str(time.time_ns()))"
      - name: Regenerate deterministic CPU examples and verify byte-for-byte SVG golden match
        env:
          BUILD123D_TECHDRAW_GPU: "0"
        run: |
          uv run python examples/generate_all.py --no-gpu
          git diff --exit-code \
            examples/output/quickstart_enclosure*.svg \
            examples/output/assembly_drawing*.svg \
            examples/output/stepped_bracket*.svg \
            examples/output/algebraic_mode_bracket*.svg \
            examples/output/builder_mode_bracket*.svg \
            examples/output/advanced_views*.svg \
            examples/output/precision_flange*.svg \
            examples/output/welded_frame_booklet*.svg \
            examples/output/interactive_3d_blueprint*.svg \
            examples/output/sdf_smart_layout*.svg \
            docs/assets/examples/quickstart_enclosure*.svg \
            docs/assets/examples/assembly_drawing*.svg \
            docs/assets/examples/stepped_bracket*.svg \
            docs/assets/examples/algebraic_mode_bracket*.svg \
            docs/assets/examples/builder_mode_bracket*.svg \
            docs/assets/examples/advanced_views*.svg \
            docs/assets/examples/precision_flange*.svg \
            docs/assets/examples/welded_frame_booklet*.svg \
            docs/assets/examples/interactive_3d_blueprint*.svg \
            docs/assets/examples/sdf_smart_layout*.svg
      - name: Verify GPU example raster outputs with perceptual SSIM tolerance (Lavapipe)
        env:
          WGPU_BACKEND_TYPE: Vulkan
        run: |
          uv run pytest tests/test_examples.py -k "gpu_example_raster or docs_example_assets" --no-cov
          uv run python examples/generate_all.py
          python3 -c "
          from pathlib import Path
          ts = int(Path('/tmp/examples_ts').read_text())
          files = (
              list(Path('examples/output').glob('*.pdf'))
              + list(Path('examples/output').glob('*.dxf'))
              + list(Path('examples/output').glob('*.png'))
              + list(Path('examples/output').glob('*.html'))
          )
          assert files, 'No PDF, DXF, PNG, or HTML outputs found'
          stale = [str(f) for f in files if f.stat().st_mtime_ns <= ts]
          assert not stale, f'Stale outputs not regenerated: {stale}'
          "

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies for OCP / OpenGL / Vulkan Lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxrender1 libxcursor1 libxft2 libxinerama1 mesa-vulkan-drivers
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}
      - name: Run full test suite (including GPU raster tests via Lavapipe)
        env:
          WGPU_BACKEND_TYPE: Vulkan
        run: uv run --python ${{ matrix.python-version }} pytest
      - name: Verify non-GPU code path
        env:
          BUILD123D_TECHDRAW_GPU: "0"
        run: uv run --python ${{ matrix.python-version }} pytest -m "not gpu" --no-cov
