name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build and validate only, do not publish to PyPI)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate-and-build:
    name: Validate and Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies for OCP / OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run linter and format checks
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run type checks
        run: uv run mypy src

      - name: Run test suite
        run: uv run pytest

      - name: Build wheel and source distribution
        run: uv build

      - name: Validate distribution artifacts
        run: uv run twine check dist/*

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v4
        if: github.event_name == 'release'
        with:
          subject-path: 'dist/*'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: [validate-and-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    environment:
      name: pypi
      url: https://pypi.org/p/build123d-techdraw
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  attach-github-release:
    name: Attach Assets to GitHub Release
    needs: [validate-and-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Upload release assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
