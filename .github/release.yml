changelog:
  categories:
    - title: "🚀 Features"
      labels:
        - "feature"
        - "enhancement"
      keywords:
        - "feat"
        - "feature"
    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
        - "fix"
      keywords:
        - "fix"
    - title: "📖 Documentation"
      labels:
        - "documentation"
        - "docs"
      keywords:
        - "docs"
    - title: "🔧 Maintenance & Internal"
      labels:
        - "chore"
        - "refactor"
        - "ci"
        - "dependencies"
      keywords:
        - "chore"
        - "refactor"
        - "test"
        - "ci"
