changelog:
  exclude:
    labels:
      - "ignore-for-release"
      - "duplicate"
      - "invalid"
      - "wontfix"
  categories:
    - title: "🚨 Breaking Changes"
      labels:
        - "breaking-change"
    - title: "🚀 Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
        - "fix"
    - title: "⚡ Performance"
      labels:
        - "performance"
    - title: "📖 Documentation"
      labels:
        - "documentation"
        - "docs"
    - title: "📦 Dependencies"
      labels:
        - "dependencies"
    - title: "🔧 Maintenance & Internal"
      labels:
        - "chore"
        - "refactor"
        - "ci"
        - "tests"
    - title: "📦 Other Changes"
      labels:
        - "*"
