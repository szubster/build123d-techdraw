site_name: build123d-techdraw
site_description: Modern 2D technical drawing and blueprint engine for build123d and Python CAD
site_author: szubster
site_url: https://szubster.github.io/build123d-techdraw/
repo_url: https://github.com/szubster/build123d-techdraw
repo_name: szubster/build123d-techdraw
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    # Slate / Dark Blueprint theme (default)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to Clean White ISO mode
    # Light / Clean White ISO theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to Dark Blueprint mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: true
            heading_level: 2
            members_order: source

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
      - Sheets & Borders: user-guide/sheets-and-views.md
      - Dimensions & Text: user-guide/dimensions.md
      - GD&T & ISO Symbols: user-guide/gdt-and-symbols.md
      - Multi-View Auto-Layout: user-guide/multiview-layout.md
      - Assemblies & BOM: user-guide/assembly-bom.md
      - Export Formats (SVG, PDF, DXF): user-guide/export-formats.md
  - API Reference:
      - Overview: api-reference/index.md
      - Core: api-reference/core.md
      - Annotations: api-reference/annotations.md
      - Layout: api-reference/layout.md
      - Renderers: api-reference/renderers.md
